<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Télescope">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Compagnon de télescope</title>
<style>
/* Disposition : en-tete, zone de contenu defilante, barre d'onglets en bas.
   Deux mondes visuels choisis par l'utilisateur : jour (clair) et nuit (rouge sombre). */
:root {
  color-scheme: light;
  --bg: #eef1f7;
  --surface: #ffffff;
  --ink: #16213a;
  --muted: #56627c;
  --line: #d3dae8;
  --accent: #2348c7;
  --accent-ink: #ffffff;
  --chip: #e5eaf6;
  --good: #1c7c46;
  --warn: #9a5b00;
  --hard: #b3261e;
  --font: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
body[data-mode="nuit"] {
  --bg: #000000;
  --surface: #0c0000;
  --ink: #c42222;
  --muted: #8a1717;
  --line: #3a0808;
  --accent: #7a0f0f;
  --accent-ink: #ff6a5e;
  --chip: #1d0303;
  --good: #c42222;
  --warn: #c42222;
  --hard: #c42222;
}
* { -webkit-box-sizing: border-box; box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.45;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
header.top {
  -webkit-flex: 0 0 auto; flex: 0 0 auto;
  display: -webkit-flex; display: flex;
  -webkit-align-items: center; align-items: center;
  -webkit-justify-content: space-between; justify-content: space-between;
  padding: 10px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.brand p { margin: 0; font-size: 13px; color: var(--muted); }
.main {
  -webkit-flex: 1 1 auto; flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 18px 28px;
}
nav.tabs {
  -webkit-flex: 0 0 auto; flex: 0 0 auto;
  display: -webkit-flex; display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
}
.tab {
  -webkit-flex: 1 1 0; flex: 1 1 0;
  min-width: 0;
  padding: 14px 4px 15px;
  font: inherit; font-size: 14px; font-weight: 600;
  color: var(--muted);
  background: none; border: 0; border-top: 3px solid transparent;
  cursor: pointer;
}
.tab.on { color: var(--accent); border-top-color: var(--accent); }
body[data-mode="nuit"] .tab.on { color: var(--accent-ink); border-top-color: var(--ink); }

h2 { font-size: 20px; margin: 26px 0 12px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 18px; margin: 0; font-weight: 700; }
p { margin: 0 0 10px; }
.count {
  display: inline-block; min-width: 26px; padding: 1px 8px; margin-left: 6px;
  font-size: 13px; font-weight: 600; text-align: center;
  color: var(--muted); background: var(--chip); border-radius: 11px; vertical-align: 2px;
}

.btn {
  display: inline-block;
  font: inherit; font-size: 16px; font-weight: 600;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 16px;
  margin: 0 8px 8px 0;
  cursor: pointer;
  text-decoration: none;
  -webkit-appearance: none;
}
.btn:focus, .tab:focus, input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.small { font-size: 15px; padding: 8px 12px; margin: 0 6px 6px 0; }
.btn.primary, .btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--hard); border-color: var(--hard); color: #ffffff; }
body[data-mode="nuit"] .btn.danger { color: #000000; }
.btn[disabled] { opacity: 0.4; }
.row-btn { margin-top: 12px; }
.row-btn.spread { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; }

.timebar {
  display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap;
  -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px 6px; margin-bottom: 14px;
}
.tb-when { margin: 0 14px 6px 0; }
.tb-label { display: block; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tb-when strong { font-size: 20px; font-variant-numeric: tabular-nums; }
.banner {
  background: var(--chip); border-left: 4px solid var(--accent);
  padding: 10px 14px; border-radius: 6px; margin-bottom: 14px;
}
.facts { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: 0 -6px 4px; }
.fact {
  -webkit-flex: 1 1 150px; flex: 1 1 150px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px; margin: 0 6px 12px;
}
.fact span { display: block; font-size: 13px; color: var(--muted); }
.fact strong { font-size: 17px; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: 1fr; grid-gap: 12px; }
@media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px 12px;
}
.card.grave { border-left: 5px solid var(--hard); }
.card-head { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; -webkit-justify-content: space-between; justify-content: space-between; }
.card-head h3 { margin-right: 10px; }
.meta { color: var(--muted); font-size: 14px; margin: 2px 0 6px; }
.pos { font-weight: 600; margin-bottom: 8px; }
.txt { margin-bottom: 10px; }
.small { font-size: 14px; color: var(--muted); }
.flags { margin-bottom: 6px; }
.chip {
  display: inline-block; font-size: 13px; font-weight: 600; white-space: nowrap;
  padding: 3px 10px; margin: 0 6px 6px 0; border-radius: 12px;
  background: var(--chip); color: var(--muted);
}
.card-head .chip { margin: 2px 0 0; }
.chip.d1, .chip.ok { color: var(--good); }
.chip.d2, .chip.warn { color: var(--warn); }
.chip.d3 { color: var(--hard); }
.how { margin: 0; padding: 10px 12px; background: var(--bg); border-radius: 8px; }
.how dt { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.how dd { margin: 0 0 8px; font-weight: 600; }
.how dd:last-child { margin-bottom: 0; }
.empty { color: var(--muted); padding: 18px 0; }
.foot { color: var(--muted); font-size: 13px; margin-top: 22px; }

.later { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; }
.later-row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.later-row:last-child { border-bottom: 0; }
.lr-time { -webkit-flex: 0 0 76px; flex: 0 0 76px; font-weight: 700; font-variant-numeric: tabular-nums; }
.lr-name { -webkit-flex: 1 1 auto; flex: 1 1 auto; padding-right: 10px; }
.later-row .chip { margin: 0; }

.map-box { height: 56vh; min-height: 340px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
#sky { display: block; }
.map-tools { margin-top: 10px; }
.map-legend { font-size: 14px; color: var(--muted); }
.lg { display: inline-block; width: 11px; height: 11px; margin: 0 5px 0 10px; vertical-align: -1px; border: 2px solid #2f9f94; border-radius: 50%; }
.lg:first-child { margin-left: 0; }
.lg-d { border-radius: 0; -webkit-transform: rotate(45deg); transform: rotate(45deg); }
.lg-p { background: #e0a020; border-color: #e0a020; }
body[data-mode="nuit"] .lg { border-color: var(--muted); }
body[data-mode="nuit"] .lg-p { background: var(--ink); border-color: var(--ink); }
.map-info { display: none; margin-top: 6px; }
.map-info.open { display: block; }
.close { float: right; margin: 10px 10px 0 0; font: inherit; font-size: 14px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 6px; cursor: pointer; }
body[data-mode="nuit"] .close { color: var(--accent-ink); }

.seg { display: -webkit-flex; display: flex; margin-bottom: 14px; }
.seg-btn { -webkit-flex: 1 1 0; flex: 1 1 0; margin: 0 6px 0 0; text-align: center; }
.seg-btn:last-child { margin-right: 0; }
.lead { color: var(--muted); }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px 14px; max-width: 760px; }
.step-n { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 4px; }
.step-t { font-size: 26px; margin: 0 0 14px; line-height: 1.2; }
.step p { font-size: 19px; line-height: 1.5; }
.note { background: var(--chip); border-radius: 8px; padding: 10px 14px; font-size: 16px !important; }
.steplist { max-width: 760px; margin: 18px 0 0; padding: 0 0 0 30px; }
.steplist li { color: var(--muted); padding: 1px 0; }
.steplist button { font: inherit; text-align: left; color: var(--ink); background: none; border: 0; padding: 6px 4px; cursor: pointer; }
.steplist button.cur { font-weight: 700; color: var(--accent); }
body[data-mode="nuit"] .steplist button.cur { color: var(--accent-ink); }
.steplist button.done { color: var(--muted); }
.plist { margin: 10px 0 6px; padding-left: 24px; }
.plist li { margin-bottom: 6px; }

.tbl { width: 100%; border-collapse: collapse; margin: 10px 0; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-word; }
.tbl.diag td:first-child { width: 42%; color: var(--muted); }
.okc { font-weight: 600; }
.koc { font-weight: 700; color: var(--hard); }

.form label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
input[type="text"], input[type="number"], select, textarea {
  display: block; width: 100%;
  font: inherit; font-size: 17px; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px;
  -webkit-appearance: none;
}
select { height: 46px; }
textarea { resize: vertical; }
.export { font-size: 14px; }
.loglist { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 2px 16px; }
.logrow { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.logrow:last-child { border-bottom: 0; }
.lg-main { -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; padding-right: 12px; }
.lg-main strong { display: block; }
.lg-date { font-size: 14px; color: var(--muted); }
.lg-main p { margin: 6px 0 0; white-space: pre-wrap; }
.logrow .btn { margin: 0; -webkit-flex: 0 0 auto; flex: 0 0 auto; }

@media (max-width: 520px) {
  body { font-size: 16px; }
  header.top { padding: 8px 12px; }
  .brand p { display: none; }
  .main { padding: 12px 12px 24px; }
  .tab { font-size: 11px; padding: 12px 1px 13px; }
  .step { padding: 16px 16px 10px; }
  .step-t { font-size: 22px; }
  .step p { font-size: 17px; }
  .map-box { height: 54vh; min-height: 300px; }
}
@media (prefers-reduced-motion: reduce) { * { -webkit-transition: none !important; transition: none !important; } }

</style>
</head>
<body data-mode="jour">
<header class="top">
  <div class="brand">
    <h1>Compagnon de télescope</h1>
    <p>NexStar 8SE et StarSense · ciel de Gatineau</p>
  </div>
  <button type="button" class="btn small" id="mode-btn" data-act="toggle-mode" style="margin:0">Mode nuit</button>
</header>
<main class="main" id="main"><p class="empty">Chargement du ciel…</p></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<noscript><p style="padding:20px">Cette page a besoin de JavaScript. Active-le dans les réglages de Safari.</p></noscript>
<script>
window.onerror = function (msg, src, line) {
  var m = document.getElementById('main');
  if (m && m.innerHTML.indexOf('Chargement') !== -1) {
    m.innerHTML = '<p class="banner">La page n\'a pas pu démarrer sur cet appareil. Détail à transmettre : ' + String(msg) + ' (ligne ' + line + ')</p>';
  }
};
</script>

/* Calculs du ciel. Syntaxe ES5 uniquement (Safari iOS 12).
   S'appuie sur la bibliotheque Astronomy Engine (objet global Astronomy). */
var CielAstro = (function () {
  'use strict';
  var RAD = Math.PI / 180;
  var obs = null;
  var site = { lat: 45.4765, lon: -75.7013, elev: 70 };

  function setObserver(lat, lon, elev) {
    site = { lat: lat, lon: lon, elev: elev || 0 };
    obs = new Astronomy.Observer(lat, lon, elev || 0);
  }
  function observer() {
    if (!obs) { setObserver(site.lat, site.lon, site.elev); }
    return obs;
  }

  /* Matrice de rotation : equatorial J2000 -> horizontal local */
  function matrix(date) {
    return Astronomy.Rotation_EQJ_HOR(Astronomy.MakeTime(date), observer()).rot;
  }

  /* Objet fixe (coordonnees J2000 en degres) -> hauteur et azimut en degres.
     Azimut compte depuis le nord vers l'est. Sans refraction. */
  function fixedAltAz(rot, raDeg, decDeg) {
    var ra = raDeg * RAD, dec = decDeg * RAD;
    var cd = Math.cos(dec);
    var x = cd * Math.cos(ra), y = cd * Math.sin(ra), z = Math.sin(dec);
    var hx = rot[0][0] * x + rot[1][0] * y + rot[2][0] * z;
    var hy = rot[0][1] * x + rot[1][1] * y + rot[2][1] * z;
    var hz = rot[0][2] * x + rot[1][2] * y + rot[2][2] * z;
    if (hz > 1) { hz = 1; }
    if (hz < -1) { hz = -1; }
    var az = Math.atan2(-hy, hx) / RAD;
    if (az < 0) { az += 360; }
    return { alt: Math.asin(hz) / RAD, az: az };
  }

  /* Astre du systeme solaire -> hauteur, azimut, magnitude, fraction eclairee */
  function bodyAltAz(name, date, refraction) {
    var t = Astronomy.MakeTime(date);
    var o = observer();
    var eq = Astronomy.Equator(name, t, o, true, true);
    var hor = Astronomy.Horizon(t, o, eq.ra, eq.dec, refraction ? 'normal' : null);
    var out = { alt: hor.altitude, az: hor.azimuth, ra: eq.ra * 15, dec: eq.dec, dist: eq.dist };
    if (name !== 'Sun') {
      try {
        var il = Astronomy.Illumination(name, t);
        out.mag = il.mag;
        out.frac = il.phase_fraction;
      } catch (e) { out.mag = null; out.frac = null; }
    }
    return out;
  }

  function sunAlt(date) {
    return bodyAltAz('Sun', date, true).alt;
  }

  function searchSunAlt(direction, startDate, altitude) {
    try {
      var r = Astronomy.SearchAltitude('Sun', observer(), direction, Astronomy.MakeTime(startDate), 1.2, altitude);
      return r ? r.date : null;
    } catch (e) { return null; }
  }

  function riseSet(name, direction, startDate) {
    try {
      var r = Astronomy.SearchRiseSet(name, observer(), direction, Astronomy.MakeTime(startDate), 1.2);
      return r ? r.date : null;
    } catch (e) { return null; }
  }

  /* Reperes de la nuit qui concerne l'instant donne.
     start = debut de l'observation (maintenant s'il fait deja nuit, sinon le
     prochain crepuscule nautique, Soleil a -12 degres). */
  function night(date) {
    var alt = sunAlt(date);
    var dark = alt <= -12;
    var start = dark ? date : searchSunAlt(-1, date, -12);
    if (!start) { start = date; }
    var end = searchSunAlt(+1, start, -12);
    if (!end) { end = new Date(start.getTime() + 8 * 3600000); }

    info.sunset = dark ? null : riseSet('Sun', -1, date);
    info.astroDusk = alt <= -18 ? null : searchSunAlt(-1, date, -18);
    info.sunrise = riseSet('Sun', +1, start);
    return info;
  }

  var PHASES = ['Nouvelle lune', 'Premier croissant', 'Premier quartier', 'Lune gibbeuse croissante',
    'Pleine lune', 'Lune gibbeuse décroissante', 'Dernier quartier', 'Dernier croissant'];

  function moon(date) {
    var t = Astronomy.MakeTime(date);

    var idx = Math.floor(((ang + 22.5) % 360) / 45);
    var b = bodyAltAz('Moon', date, true);
    return {

      rise: riseSet('Moon', +1, date), set: riseSet('Moon', -1, date)

  }

  var DIRS = ['nord', 'nord-nord-est', 'nord-est', 'est-nord-est', 'est', 'est-sud-est', 'sud-est', 'sud-sud-est',
    'sud', 'sud-sud-ouest', 'sud-ouest', 'ouest-sud-ouest', 'ouest', 'ouest-nord-ouest', 'nord-ouest', 'nord-nord-ouest'];
  function direction(az) {
    return DIRS[Math.round(az / 22.5) % 16];
  }

  return {
    setObserver: setObserver, matrix: matrix, fixedAltAz: fixedAltAz, bodyAltAz: bodyAltAz,
    sunAlt: sunAlt, night: night, moon: moon, direction: direction, riseSet: riseSet,
    site: function () { return site; }
  };
})();

    }
    h += '</div><p class="lead">' + esc(P.resume) + '</p>';
    h += '<div class="step"><p class="step-n">Étape ' + (idx + 1) + ' de ' + P.etapes.length + '</p><h2 class="step-t">' + esc(st.t) + '</h2>';
    for (var j = 0; j < st.p.length; j++) { h += '<p>' + esc(st.p[j]) + '</p>'; }
    if (st.note) { h += '<p class="note">' + esc(st.note) + '</p>'; }
    h += '<div class="row-btn spread"><button type="button" class="btn" data-act="gprev"' + (idx === 0 ? ' disabled' : '') + '>Précédente</button>';
    h += '<button type="button" class="btn primary" data-act="gnext"' + (idx === P.etapes.length - 1 ? ' disabled' : '') + '>Suivante</button></div></div>';
    h += '<ol class="steplist">';
    for (var k = 0; k < P.etapes.length; k++) {
      h += '<li><button type="button" class="' + (k === idx ? 'cur' : (k < idx ? 'done' : '')) + '" data-act="gstep" data-i="' + k + '">' + esc(P.etapes[k].t) + '</button></li>';
    }
    h += '</ol><p class="foot">Les étapes de la manette suivent le manuel Celestron du StarSense AutoAlign. Les libellés à l\'écran sont en anglais et peuvent varier légèrement selon la version de ta manette.</p>';
    return h;
  }

  /* ---------- Vue : Aide-memoire ---------- */
  function renderMemo() {
    var tabs = [['procedures', 'Procédures'], ['astuces', 'Trucs et astuces'], ['eviter', 'À éviter']];
    var h = '<div class="seg">';
    for (var i = 0; i < tabs.length; i++) {
      h += '<button type="button" class="btn seg-btn' + (S.memo === tabs[i][0] ? ' on' : '') + '" data-act="memo" data-k="' + tabs[i][0] + '">' + tabs[i][1] + '</button>';
    }
    h += '</div>';
    var j, k, it;
    if (S.memo === 'procedures') {
      h += '<div class="grid">';
      for (j = 0; j < CIEL_CONTENT.procedures.length; j++) {
        it = CIEL_CONTENT.procedures[j];
        h += '<div class="card"><h3>' + esc(it.t) + '</h3><ol class="plist">';
        for (k = 0; k < it.l.length; k++) { h += '<li>' + esc(it.l[k]) + '</li>'; }
        h += '</ol></div>';
      }
      var l = eyeList();
      h += '<div class="card"><h3>Tes grossissements</h3>';
      if (l.length) {
        h += '<table class="tbl"><thead><tr><th>Oculaire</th><th>Grossissement</th><th>Champ visible</th></tr></thead><tbody>';
        for (k = 0; k < l.length; k++) {
          var gr = FOCALE / l[k];
          h += '<tr><td>' + num(l[k], l[k] % 1 ? 1 : 0) + ' mm</td><td>' + Math.round(gr) + ' fois</td><td>environ ' + num(CHAMP_APPARENT / gr, 2) + '°</td></tr>';
        }
        h += '</tbody></table><p class="small">Grossissement = 2032 ÷ le chiffre en millimètres de l\'oculaire. À titre de repère, la pleine Lune mesure 0,5°. Le champ visible est estimé pour un oculaire courant.</p>';
      } else {
        h += '<p>Entre tes oculaires dans l\'onglet Réglages pour voir tes grossissements.</p>';
      }
      h += '</div></div>';
    } else {
      var arr = S.memo === 'astuces' ? CIEL_CONTENT.astuces : CIEL_CONTENT.eviter;
      h += '<div class="grid">';
      for (j = 0; j < arr.length; j++) {
        it = arr[j];
        h += '<div class="card' + (it.grave ? ' grave' : '') + '"><h3>' + esc(it.t) + '</h3><p class="txt">' + esc(it.d) + '</p></div>';
      }
      h += '</div>';
    }
    return h;
  }

  /* ---------- Vue : Carnet ---------- */
  function allTargets() {
    var out = [];
    var k;
    for (k in CIEL_CONTENT.planetes) {
      if (CIEL_CONTENT.planetes.hasOwnProperty(k)) { out.push([k, CIEL_CONTENT.planetes[k].nom]); }
    }
    for (var i = 0; i < CIEL_DATA.targets.length; i++) { out.push([CIEL_DATA.targets[i].id, CIEL_DATA.targets[i].name]); }
    return out;
  }
  function targetName(id) {
    var a = allTargets();
    for (var i = 0; i < a.length; i++) { if (a[i][0] === id) { return a[i][1]; } }
    return id;
  }
  function exportText() {
    var out = 'Carnet d\'observation\n';
    for (var i = 0; i < S.log.length; i++) {
      var e = S.log[i];
      out += '\n' + fDateHeure(new Date(e.t)) + ' ' + new Date(e.t).getFullYear() + '\n' + (e.id === 'autre' ? e.other : targetName(e.id)) + (e.eye ? ' — oculaire ' + e.eye : '') + '\n' + (e.note || '') + '\n';
    }
    return out;
  }
  function renderCarnet() {
    var d = S.logDraft || { id: '', other: '', note: '', eye: '' };
    var a = allTargets();
    var h = '<div class="card form"><h3>Nouvelle observation</h3>';
    h += '<label for="log-id">Cible</label><select id="log-id"><option value="">Choisir…</option>';
    for (var i = 0; i < a.length; i++) { h += '<option value="' + esc(a[i][0]) + '"' + (d.id === a[i][0] ? ' selected' : '') + '>' + esc(a[i][1]) + '</option>'; }
    h += '<option value="autre"' + (d.id === 'autre' ? ' selected' : '') + '>Autre…</option></select>';
    h += '<label for="log-other">Si autre, laquelle</label><input type="text" id="log-other" value="' + esc(d.other || '') + '" autocomplete="off">';
    h += '<label for="log-eye">Oculaire utilisé</label><input type="text" id="log-eye" value="' + esc(d.eye || '') + '" placeholder="par exemple 25 mm" autocomplete="off">';
    h += '<label for="log-note">Ce que j\'ai vu</label><textarea id="log-note" rows="4">' + esc(d.note || '') + '</textarea>';
    h += '<div class="row-btn"><button type="button" class="btn primary" data-act="logsave">Enregistrer</button></div>';
    if (S.logMsg) { h += '<p class="note">' + esc(S.logMsg) + '</p>'; }
    h += '</div>';
    h += '<h2>Mes observations <span class="count">' + S.log.length + '</span></h2>';
    if (!S.log.length) {
      h += '<p class="empty">Ton carnet est vide. Ta première entrée apparaîtra ici.</p>';
    } else {
      h += '<div class="loglist">';
      for (var j = 0; j < S.log.length; j++) {
        var e = S.log[j];
        var dt = new Date(e.t);
        h += '<div class="logrow"><div class="lg-main"><strong>' + esc(e.id === 'autre' ? e.other : targetName(e.id)) + '</strong><span class="lg-date">' + esc(fDateHeure(dt) + ' ' + dt.getFullYear()) + (e.eye ? ' · ' + esc(e.eye) : '') + '</span>';
        if (e.note) { h += '<p>' + esc(e.note) + '</p>'; }
        h += '</div><button type="button" class="btn small ' + (S.confirmDel === e.t ? 'danger' : 'ghost') + '" data-act="logdel" data-t="' + e.t + '">' + (S.confirmDel === e.t ? 'Confirmer' : 'Supprimer') + '</button></div>';
      }
      h += '</div><h2>Copie de sécurité</h2><p class="small">Ton carnet est enregistré seulement dans cet iPad. Pour en garder une copie, sélectionne le texte ci-dessous et copie-le, ou envoie-le-toi par courriel.</p>';
      h += '<textarea id="log-export" class="export" rows="8" readonly>' + esc(exportText()) + '</textarea>';
      h += '<div class="row-btn"><a class="btn ghost" href="mailto:?subject=' + encodeURIComponent('Carnet d\'observation') + '&amp;body=' + encodeURIComponent(exportText()) + '">Envoyer par courriel</a></div>';
    }
    if (!storageOk) { h += '<p class="banner">L\'enregistrement n\'est pas disponible dans ce navigateur : le carnet sera perdu à la fermeture de la page.</p>'; }
    return h;
  }
  function readDraft() {
    if (!$('log-id')) { return; }
    S.logDraft = { id: $('log-id').value, other: $('log-other').value, note: $('log-note').value, eye: $('log-eye').value };
  }

  /* ---------- Vue : Reglages ---------- */
  function renderReglages() {
    var h = '<div class="grid">';
    h += '<div class="card form"><h3>Affichage</h3><p class="txt">Le mode nuit affiche tout en rouge sombre pour protéger ta vision près du télescope. Baisse aussi la luminosité de l\'iPad.</p>';
    h += '<div class="seg"><button type="button" class="btn seg-btn' + (S.mode === 'jour' ? ' on' : '') + '" data-act="mode" data-m="jour">Jour</button><button type="button" class="btn seg-btn' + (S.mode === 'nuit' ? ' on' : '') + '" data-act="mode" data-m="nuit">Nuit</button></div></div>';
    h += '<div class="card form"><h3>Mes oculaires</h3><p class="txt">Le chiffre est gravé sur l\'oculaire, en millimètres. Laisse à zéro si tu n\'as pas le deuxième sous la main.</p>';
    h += '<label for="eye-0">Premier oculaire (mm)</label><input type="number" inputmode="decimal" id="eye-0" min="0" max="60" step="0.5" value="' + esc(S.eyes[0] || 0) + '">';
    h += '<label for="eye-1">Deuxième oculaire (mm)</label><input type="number" inputmode="decimal" id="eye-1" min="0" max="60" step="0.5" value="' + esc(S.eyes[1] || 0) + '">';
    h += '<div class="row-btn"><button type="button" class="btn primary" data-act="eyesave">Enregistrer</button></div></div>';
    h += '<div class="card form"><h3>Lieu d\'observation</h3><p class="txt">Réglé pour Gatineau. À changer seulement si tu observes à plus de 100 km d\'ici.</p>';
    h += '<label for="site-lat">Latitude (nord positif)</label><input type="number" inputmode="decimal" id="site-lat" step="0.0001" value="' + esc(S.site.lat) + '">';
    h += '<label for="site-lon">Longitude (ouest négatif)</label><input type="number" inputmode="decimal" id="site-lon" step="0.0001" value="' + esc(S.site.lon) + '">';
    h += '<div class="row-btn"><button type="button" class="btn primary" data-act="sitesave">Enregistrer</button><button type="button" class="btn ghost" data-act="sitereset">Remettre Gatineau</button></div></div>';
    h += '<div class="card form"><h3>Écran toujours allumé</h3><p class="txt">Pour que l\'iPad ne s\'éteigne pas pendant l\'observation : Réglages de l\'iPad, Luminosité et affichage, Verrouillage automatique, Jamais. Pour un affichage plein écran, ouvre le menu de partage de Safari et choisis « Sur l\'écran d\'accueil ».</p></div>';
    h += '<div class="card form"><h3>Diagnostic</h3><p class="txt">Vérifie ce que cet appareil sait faire, et la vitesse de dessin de la carte.</p><div class="row-btn"><button type="button" class="btn" data-act="diag">Lancer le diagnostic</button></div>';
    if (S.diag) {
      h += '<table class="tbl diag"><tbody>';
      for (var i = 0; i < S.diag.length; i++) {
        h += '<tr><td>' + esc(S.diag[i][0]) + '</td><td class="' + (S.diag[i][2] ? 'okc' : 'koc') + '">' + esc(S.diag[i][1]) + '</td></tr>';
      }
      h += '</tbody></table>';
    }
    h += '</div>';
    h += '<div class="card form"><h3>À propos</h3><p class="txt">Compagnon de télescope, version ' + VERSION + '. Conçu pour un Celestron NexStar 8SE avec StarSense AutoAlign, sur un iPad Air sous iOS 12.</p>';
    h += '<p class="small">Positions calculées avec Astronomy Engine (Don Cross, licence MIT). Étoiles, constellations et objets Messier tirés de d3-celestial (Olaf Frohn, licence BSD). Procédures de la manette d\'après le manuel Celestron StarSense AutoAlign. Les séparations des étoiles doubles sont approximatives.</p></div>';
    h += '</div>';
    return h;
  }
  function runDiag() {
    var r = [];
    var ok;
    r.push(['Version de l\'application', VERSION, true]);
    ok = false;
    try { window.localStorage.setItem('ciel.test', '1'); ok = window.localStorage.getItem('ciel.test') === '1'; window.localStorage.removeItem('ciel.test'); } catch (e) { ok = false; }
    r.push(['Enregistrement du carnet', ok ? 'fonctionne' : 'indisponible', ok]);
    var c = document.createElement('canvas');
    ok = !!(c.getContext && c.getContext('2d'));
    r.push(['Dessin de la carte', ok ? 'fonctionne' : 'indisponible', ok]);
    var sw = 'serviceWorker' in navigator;
    r.push(['Mode hors ligne', sw ? (navigator.serviceWorker.controller ? 'actif' : 'disponible, pas encore actif') : 'non pris en charge', sw]);
    r.push(['Connexion', navigator.onLine === false ? 'hors ligne' : 'en ligne', true]);
    r.push(['Ouvert depuis l\'écran d\'accueil', navigator.standalone ? 'oui' : 'non', true]);
    r.push(['Écran', window.innerWidth + ' × ' + window.innerHeight + ' points, densité ' + (window.devicePixelRatio || 1), true]);
    /* vitesse de calcul et de dessin */
    var t0 = Date.now();
    var n = 0;
    var keepCv = cv, keepCtx = ctx, keepW = cw, keepH = chh, keepD = dpr;
    var tmp = document.createElement('canvas');
    cv = tmp; ctx = tmp.getContext('2d'); cw = 700; chh = 700; dpr = Math.min(window.devicePixelRatio || 1, 2);
    tmp.width = cw * dpr; tmp.height = chh * dpr;
    for (n = 0; n < 10; n++) { drawMap(); }
    var ms = (Date.now() - t0) / 10;
    cv = keepCv; ctx = keepCtx; cw = keepW; chh = keepH; dpr = keepD;
    r.push(['Dessin de la carte', Math.round(ms) + ' millisecondes par image', ms < 250]);
    t0 = Date.now();
    cache.key = null;
    compute(now());
    r.push(['Calcul de la soirée', (Date.now() - t0) + ' millisecondes', (Date.now() - t0) < 3000]);
    r.push(['Navigateur', navigator.userAgent, true]);
    S.diag = r;
  }

  /* ---------- Rendu general ---------- */
  function render() {
    document.body.setAttribute('data-mode', S.mode);
    var tabs = '';
    for (var i = 0; i < VIEWS.length; i++) {
      tabs += '<button type="button" class="tab' + (S.view === VIEWS[i][0] ? ' on' : '') + '" data-act="view" data-v="' + VIEWS[i][0] + '">' + VIEWS[i][1] + '</button>';
    }
    $('tabs').innerHTML = tabs;
    $('mode-btn').textContent = S.mode === 'jour' ? 'Mode nuit' : 'Mode jour';
    var main = $('main');
    var h = '';
    cv = null; ctx = null;
    main.className = 'main v-' + S.view;
    try {
      if (S.view === 'soir') { h = renderSoir(); }
      else if (S.view === 'carte') { h = renderCarte(); }
      else if (S.view === 'guide') { h = renderGuide(); }
      else if (S.view === 'memo') { h = renderMemo(); }
      else if (S.view === 'carnet') { h = renderCarnet(); }
      else { h = renderReglages(); }
    } catch (e) {
      h = '<p class="banner">Une erreur est survenue dans cet écran : ' + esc(e && e.message ? e.message : e) + '</p>';
    }
    main.innerHTML = h;
    if (S.view === 'carte') { bindMap(); }
  }
  function go(view) {
    readDraft();
    S.view = view; sset('view', view);
    render();
    $('main').scrollTop = 0;
  }

  /* ---------- Actions ---------- */
  function act(a, el) {
    var d;
    if (a === 'view') { go(el.getAttribute('data-v')); return; }
    if (a === 'toggle-mode' || a === 'mode') {
      S.mode = a === 'mode' ? el.getAttribute('data-m') : (S.mode === 'jour' ? 'nuit' : 'jour');
      sset('mode', S.mode); readDraft(); render(); return;
    }
    if (a === 't-1' || a === 't+1') {
      d = now();
      S.time = new Date(d.getTime() + (a === 't+1' ? 3600000 : -3600000));
      S.autoNight = false; render(); return;
    }
    if (a === 'tnow') { S.time = null; S.autoNight = false; render(); return; }
    if (a === 'tnight') {
      var n = CielAstro.night(new Date());
      S.time = n.dark ? null : n.start; S.autoNight = false; render(); return;
    }
    if (a === 'show') { S.map.sel = el.getAttribute('data-id'); S.map.star = null; go('carte'); return; }
    if (a === 'note') { S.logDraft = { id: el.getAttribute('data-id'), other: '', note: '', eye: '' }; S.logMsg = ''; S.view = 'carnet'; sset('view', 'carnet'); render(); $('main').scrollTop = 0; return; }
    if (a === 'unsel') { S.map.sel = null; S.map.star = null; drawMap(); mapInfo(); return; }
    if (a === 'zin' || a === 'zout') {
      S.map.zoom = Math.max(1, Math.min(5, S.map.zoom * (a === 'zin' ? 1.5 : 1 / 1.5)));
      if (S.map.zoom < 1.05) { S.map.zoom = 1; S.map.px = 0; S.map.py = 0; }
      drawMap(); return;
    }
    if (a === 'zreset') { S.map.zoom = 1; S.map.px = 0; S.map.py = 0; drawMap(); return; }
    if (a === 'lines' || a === 'names') { S.map[a] = !S.map[a]; render(); return; }
    if (a === 'gpart') { S.guide.part = parseInt(el.getAttribute('data-i'), 10); sset('guide', S.guide); render(); $('main').scrollTop = 0; return; }
    if (a === 'gprev' || a === 'gnext' || a === 'gstep') {
      var p = S.guide.part;
      var max = CIEL_CONTENT.guide[p].etapes.length - 1;
      var cur = S.guide.step[p] || 0;
      if (a === 'gprev') { cur--; } else if (a === 'gnext') { cur++; } else { cur = parseInt(el.getAttribute('data-i'), 10); }
      S.guide.step[p] = Math.max(0, Math.min(max, cur));
      sset('guide', S.guide); render(); $('main').scrollTop = 0; return;
    }
    if (a === 'memo') { S.memo = el.getAttribute('data-k'); render(); $('main').scrollTop = 0; return; }
    if (a === 'logsave') {
      readDraft();
      d = S.logDraft;
      if (!d.id || (d.id === 'autre' && !d.other)) { S.logMsg = 'Choisis une cible avant d\'enregistrer.'; render(); return; }
      S.log.unshift({ t: Date.now(), id: d.id, other: d.other, note: d.note, eye: d.eye });
      sset('log', S.log);
      S.logDraft = null; S.logMsg = storageOk ? 'Observation enregistrée.' : 'Observation notée, mais ce navigateur ne peut pas la conserver.';
      cache.key = null; render(); return;
    }
    if (a === 'logdel') {
      var t = parseInt(el.getAttribute('data-t'), 10);
      readDraft();
      if (S.confirmDel !== t) { S.confirmDel = t; render(); return; }
      var keep = [];
      for (var i = 0; i < S.log.length; i++) { if (S.log[i].t !== t) { keep.push(S.log[i]); } }
      S.log = keep; sset('log', S.log); S.confirmDel = null; render(); return;
    }
    if (a === 'eyesave') {
      S.eyes = [parseFloat($('eye-0').value) || 0, parseFloat($('eye-1').value) || 0];
      sset('eyes', S.eyes); render(); return;
    }
    if (a === 'sitesave' || a === 'sitereset') {
      var la = a === 'sitereset' ? 45.4765 : parseFloat($('site-lat').value);
      var lo = a === 'sitereset' ? -75.7013 : parseFloat($('site-lon').value);
      if (isNaN(la) || isNaN(lo) || la < -90 || la > 90 || lo < -180 || lo > 180) { return; }
      S.site = { lat: la, lon: lo }; sset('site', S.site); cache.key = null; render(); return;
    }
    if (a === 'diag') { runDiag(); render(); return; }
  }

  function start() {
    try { initTime(); } catch (e) { S.time = null; }
    document.addEventListener('click', function (e) {
      var el = e.target;
      while (el && el !== document.body) {
        if (el.getAttribute && el.getAttribute('data-act')) {
          if (el.disabled) { return; }
          act(el.getAttribute('data-act'), el);
          return;
        }
        el = el.parentNode;
      }
    }, false);
    window.addEventListener('resize', function () { if (S.view === 'carte' && cv) { sizeCanvas(); drawMap(); } }, false);
    window.addEventListener('orientationchange', function () {
      window.setTimeout(function () { if (S.view === 'carte' && cv) { sizeCanvas(); drawMap(); } }, 300);
    }, false);
    /* heure actuelle : rafraichir chaque minute, sans deranger une saisie */
    window.setInterval(function () {
      if (S.time) { return; }
      if (S.view === 'carte' && cv) { drawMap(); }
      else if (S.view === 'soir') { var st = $('main').scrollTop; render(); $('main').scrollTop = st; }
    }, 60000);
    render();
    if ('serviceWorker' in navigator && window.location.protocol === 'https:' && navigator.onLine !== false) {
      try { navigator.serviceWorker.register('sw.js').then(function () {}, function () {}); } catch (e2) { /* sans objet */ }
    }
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', start, false); } else { start(); }
})();

</script>
